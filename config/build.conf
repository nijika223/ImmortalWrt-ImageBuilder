# 环境变量可覆盖默认值；VERSION 留空时自动选择当前系列的最新正式版。
RELEASE_SERIES=${RELEASE_SERIES:-25.12}
VERSION=${VERSION:-}
PROFILE=${PROFILE:-generic}
ROOTFS_SIZE=${ROOTFS_SIZE:-2000}

# all：IMG、ISO、QCOW2、VDI、VHDX、VMDK 和 rootfs.tar.gz；ext4-efi：仅 ext4 UEFI。
IMAGE_MODE=${IMAGE_MODE:-ext4-efi}
DOWNLOAD_BASE=${DOWNLOAD_BASE:-https://downloads.immortalwrt.org}
